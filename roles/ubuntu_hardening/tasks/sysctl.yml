---
- name: Sesuaikan parameter rp_filter pada 10-network-security.conf agar tidak konflik dengan CIS
  ansible.builtin.replace:
    path: /etc/sysctl.d/10-network-security.conf
    regexp: '^(net\.ipv4\.conf\.(all|default)\.rp_filter\s*=\s*)2'
    replace: '\g<1>1'
  failed_when: false

- name: Terapkan konfigurasi sysctl untuk CIS Network & Kernel Security
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-cis-hardening.conf
    reload: true
  loop:
    - { name: 'net.ipv4.ip_forward', value: '0' }
    - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
    - { name: 'net.ipv4.conf.default.send_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.accept_source_route', value: '0' }
    - { name: 'net.ipv4.conf.default.accept_source_route', value: '0' }
    - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
    - { name: 'net.ipv4.conf.default.accept_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.secure_redirects', value: '0' }
    - { name: 'net.ipv4.conf.default.secure_redirects', value: '0' }
    - { name: 'net.ipv4.tcp_syncookies', value: '1' }
    - { name: 'net.ipv4.conf.all.log_martians', value: '1' }
    - { name: 'net.ipv4.conf.default.log_martians', value: '1' }
    - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
    - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', value: '1' }
    - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
    - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
    - { name: 'net.ipv6.conf.all.forwarding', value: '0' }
    - { name: 'net.ipv6.conf.default.forwarding', value: '0' }
    - { name: 'net.ipv6.conf.all.accept_ra', value: '0' }
    - { name: 'net.ipv6.conf.default.accept_ra', value: '0' }
    - { name: 'net.ipv6.conf.all.accept_source_route', value: '0' }
    - { name: 'net.ipv6.conf.default.accept_source_route', value: '0' }
    - { name: 'net.ipv6.conf.all.accept_redirects', value: '0' }
    - { name: 'net.ipv6.conf.default.accept_redirects', value: '0' }
    - { name: 'kernel.randomize_va_space', value: '2' }
    - { name: 'kernel.dmesg_restrict', value: '1' }
    - { name: 'kernel.apparmor_restrict_unprivileged_unconfined', value: '1' }
    - { name: 'fs.suid_dumpable', value: '0' }

- name: Terapkan konfigurasi sysctl untuk Mitigasi DoS/DDoS & TCP Stack Tuning
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/98-ddos-protection.conf
    reload: true
  loop:
    # Memperbesar buffer antrean koneksi & backlog soket
    - { name: 'net.core.somaxconn', value: '65535' }
    - { name: 'net.core.netdev_max_backlog', value: '10000' }
    - { name: 'net.ipv4.tcp_max_syn_backlog', value: '65535' }
    # Mempercepat pelepasan koneksi mati/zombie & mengurangi waktu tunggu half-open
    - { name: 'net.ipv4.tcp_fin_timeout', value: '15' }
    - { name: 'net.ipv4.tcp_syn_retries', value: '2' }
    - { name: 'net.ipv4.tcp_synack_retries', value: '2' }
    - { name: 'net.ipv4.tcp_tw_reuse', value: '1' }
    # Proteksi tabel Connection Tracking (Conntrack) dari saturasi flood
    - { name: 'net.netfilter.nf_conntrack_max', value: '262144' }
    - { name: 'net.netfilter.nf_conntrack_tcp_timeout_syn_recv', value: '30' }
    - { name: 'net.netfilter.nf_conntrack_tcp_timeout_time_wait', value: '30' }
  when: hardening_enable_ddos_sysctl | default(true) | bool
  ignore_errors: true
