---
- name: Atur izin berkas /etc/ssh/sshd_config menjadi 0600
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'

- name: Pastikan direktori /etc/ssh/sshd_config.d ada dengan izin aman
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Buat konfigurasi hardening OpenSSH 24.04 (CIS Strong Config)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-cis-hardening.conf
    owner: root
    group: root
    mode: '0600'
    content: |
      Port 22
      PermitRootLogin no
      PubkeyAuthentication yes
      PasswordAuthentication no
      PermitEmptyPasswords no
      X11Forwarding no
      MaxAuthTries 4
      ClientAliveInterval 300
      ClientAliveCountMax 3
      LoginGraceTime 60
      AllowTcpForwarding no
      AllowAgentForwarding no
      DisableForwarding yes
      HostbasedAuthentication no
      IgnoreRhosts yes
      GSSAPIAuthentication no
      PermitUserEnvironment no
      LogLevel INFO
      MaxSessions 10
      MaxStartups 10:30:60
      Banner /etc/issue.net
      AllowUsers sysadmin
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
      MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
      KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256
  notify: Restart sshd

- name: Konfigurasi banner login SSH pada /etc/issue.net
  ansible.builtin.copy:
    dest: /etc/issue.net
    owner: root
    group: root
    mode: '0644'
    content: |
      *****************************************************************
      * PERINGATAN: Akses hanya untuk personel terotorisasi.          *
      * Seluruh aktivitas dimonitor dan dicatat dalam audit keamanan. *
      *****************************************************************
