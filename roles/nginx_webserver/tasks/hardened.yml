---
- name: Cek ketersediaan berkas Diffie-Hellman parameters (dhparam.pem)
  ansible.builtin.stat:
    path: /etc/nginx/dhparam.pem
  register: nginx_dhparam

- name: Buat Diffie-Hellman parameters 2048-bit untuk forward secrecy
  ansible.builtin.command:
    cmd: openssl dhparam -out /etc/nginx/dhparam.pem 2048
  when: not nginx_dhparam.stat.exists

- name: Cek ketersediaan sertifikat SSL hardened
  ansible.builtin.stat:
    path: "{{ webserver_ssl_cert_dir }}/nginx-hardened.crt"
  register: hardened_ssl_cert

- name: Periksa apakah sertifikat SSL hardened memiliki ekstensi SAN (Subject Alternative Name)
  ansible.builtin.shell:
    cmd: "openssl x509 -in {{ webserver_ssl_cert_dir }}/nginx-hardened.crt -text -noout | grep -q 'Subject Alternative Name'"
  register: hardened_cert_has_san
  failed_when: false
  changed_when: false
  when: hardened_ssl_cert.stat.exists

- name: Buat sertifikat SSL self-signed untuk HTTPS hardened dengan SAN
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -days 365 -newkey rsa:2048
      -keyout {{ webserver_ssl_key_dir }}/nginx-hardened.key
      -out {{ webserver_ssl_cert_dir }}/nginx-hardened.crt
      -subj "/C=ID/ST=DKI/L=Jakarta/O=HardenedProduction/CN={{ inventory_hostname }}"
      -addext "subjectAltName=IP:{{ ansible_facts.get('default_ipv4', {}).get('address', ansible_host) }},DNS:{{ inventory_hostname }},DNS:localhost"
  when: not hardened_ssl_cert.stat.exists or (hardened_cert_has_san.rc | default(1) != 0)
  notify: Reload nginx

- name: Amankan izin berkas private key SSL hardened (0600)
  ansible.builtin.file:
    path: "{{ webserver_ssl_key_dir }}/nginx-hardened.key"
    owner: root
    group: root
    mode: '0600'

- name: Terapkan konfigurasi utama Nginx hardened (/etc/nginx/nginx.conf)
  ansible.builtin.template:
    src: hardened_nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Hapus konfigurasi security headers lama di conf.d jika ada
  ansible.builtin.file:
    path: /etc/nginx/conf.d/security_headers.conf
    state: absent
  notify: Reload nginx

- name: Pastikan direktori snippets Nginx tersedia (/etc/nginx/snippets)
  ansible.builtin.file:
    path: /etc/nginx/snippets
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Terapkan konfigurasi security headers (/etc/nginx/snippets/security_headers.conf)
  ansible.builtin.template:
    src: hardened_security_headers.conf.j2
    dest: /etc/nginx/snippets/security_headers.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Terapkan konfigurasi Virtual Host Nginx hardened
  ansible.builtin.template:
    src: hardened_site.conf.j2
    dest: /etc/nginx/sites-available/hardened.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Nonaktifkan vhost default Nginx
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Aktifkan vhost hardened Nginx
  ansible.builtin.file:
    src: /etc/nginx/sites-available/hardened.conf
    dest: /etc/nginx/sites-enabled/hardened.conf
    state: link
  notify: Reload nginx

- name: Pastikan direktori document root web server tersedia
  ansible.builtin.file:
    path: "{{ webserver_web_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Pasang dummy web page hardened pada /var/www/html/index.html
  ansible.builtin.template:
    src: hardened_index.html.j2
    dest: "{{ webserver_web_root }}/index.html"
    owner: www-data
    group: www-data
    mode: '0644'

- name: Pasang custom error page 404 hardened pada document root
  ansible.builtin.template:
    src: 404.html.j2
    dest: "{{ webserver_web_root }}/404.html"
    owner: www-data
    group: www-data
    mode: '0644'

- name: Pasang custom error page 50x hardened pada document root
  ansible.builtin.template:
    src: 50x.html.j2
    dest: "{{ webserver_web_root }}/50x.html"
    owner: www-data
    group: www-data
    mode: '0644'

- name: Buka port HTTP (80) dan HTTPS (443) pada firewall nftables
  block:
    - name: Cek keberadaan berkas konfigurasi nftables
      ansible.builtin.stat:
        path: /etc/nftables.conf
      register: nftables_conf_stat

    - name: Terapkan berkas aturan /etc/nftables.rules dengan port 80 & 443 terbuka
      ansible.builtin.template:
        src: nftables.rules.j2
        dest: /etc/nftables.rules
        owner: root
        group: root
        mode: '0644'
      when: nftables_conf_stat.stat.exists
      register: nft_rules_result
      notify: Reload nftables

    - name: Muat ulang aturan nftables jika konfigurasi ruleset berubah
      ansible.builtin.service:
        name: nftables
        state: reloaded
      when: nftables_conf_stat.stat.exists and (nft_rules_result.changed | default(false))
  rescue:
    - name: Catatan kegagalan reload nftables (diabaikan jika nftables belum dikonfigurasi)
      ansible.builtin.debug:
        msg: "Nftables tidak aktif atau belum terpasang, melewatkan update nftables."

- name: Uji validitas sintaks konfigurasi Nginx hardened
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
